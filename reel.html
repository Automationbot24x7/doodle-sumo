<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Sumo Reel</title>
<link rel="icon" href="assets/ui/icon.png">
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root { --ink: #2b2b33; --red: #e2453c; --blue: #3d7be0; --yellow: #f6c431; --line: #c9daf2; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Nunito', sans-serif; color: var(--ink);
    background: linear-gradient(90deg, transparent 7vw, rgba(226,69,60,.35) 7vw, rgba(226,69,60,.35) calc(7vw + 2px), transparent calc(7vw + 2px)), repeating-linear-gradient(180deg, transparent 0 39px, var(--line) 39px 40px), #fbf8f1; }
  #stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .layer { position: absolute; width: min(78vh, 78vw); height: min(78vh, 78vw); left: 50%; top: 50%; transform: translate(-50%, -50%); transition: opacity .6s ease, transform .6s ease; }
  #doodle svg { width: 100%; height: 100%; }
  #doodle svg > rect { fill: transparent; }
  #toy { opacity: 0; object-fit: contain; border-radius: 24px; }
  #three { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .5s ease; }
  .cap { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); font-family: 'Gaegu', cursive; font-weight: 700; font-size: 6vh; white-space: nowrap; }
  .cap b { color: var(--red); }
  .step { position: absolute; left: 4vw; top: 5vh; font-weight: 900; font-size: 2.4vh; letter-spacing: .1em; color: #8a8a96; }
  .step i { font-style: normal; color: var(--blue); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sparkle { position: absolute; font-size: 7vh; opacity: 0; transition: opacity .3s, transform .6s; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="doodle" class="layer"></div>
  <img id="toy" class="layer" alt="">
  <canvas id="three"></canvas>
</div>
<div class="step" id="step"></div>
<div class="cap" id="cap"></div>
<div class="flash" id="flash"></div>
<script type="module" src="src/reel.js"></script>
</body>
</html>
