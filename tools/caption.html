<!doctype html><html><head><meta charset="utf-8"><title>caption</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
  .lt{position:absolute;left:70px;bottom:150px;display:flex;align-items:center;gap:16px;background:#fbf8f1;border:5px solid #2b2b33;border-radius:18px 14px 20px 16px;padding:12px 26px 12px 16px;box-shadow:8px 9px 0 rgba(43,43,51,.9);transform:rotate(-1.2deg)}
  .lt .chip{font:900 22px Nunito,sans-serif;color:#fff;background:#e2453c;border-radius:12px;padding:6px 12px;letter-spacing:.04em}
  .lt .txt{font:800 34px Nunito,sans-serif;color:#2b2b33}
  .big{position:absolute;left:0;right:0;top:74%;text-align:center;font:700 120px Gaegu,cursive;color:#fff;-webkit-text-stroke:5px #2b2b33;paint-order:stroke fill;text-shadow:8px 9px 0 #2b2b33}
</style></head><body>
<script>
const q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {});
if (q.get('big')) document.body.innerHTML = `<div class="big">${q.get('big')}</div>`;
else document.body.innerHTML = `<div class="lt"><span class="chip">${q.get('chip') || 'LUX3D'}</span><span class="txt">${q.get('t')}</span></div>`;
document.fonts.ready.then(() => setTimeout(() => (window.done = true), 300));
</script></body></html>
